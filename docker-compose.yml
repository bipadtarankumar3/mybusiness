services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-chatflow_root_dev}
      MYSQL_DATABASE: ${DB_NAME:-chatflow}
      MYSQL_USER: ${DB_USER:-chatflow_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chatflow_pass_dev}
    volumes:
      - mysql_data:/var/lib/mysql
    # Bound only to localhost (never exposed publicly by default)
    ports:
      - "127.0.0.1:3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-chatflow_root_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-chatflow}
      DB_USER: ${DB_USER:-chatflow_user}
      DB_PASSWORD: ${DB_PASSWORD:-chatflow_pass_dev}
      AUTH_SECRET: ${AUTH_SECRET:-dev_only_replace_with_32_byte_random_secret_value}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:-dev_only_replace_with_password_reset_secret_val}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-dev_only_replace_with_32_byte_encryption_secret}
      REDIS_URL: redis://redis:6379
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      BACKEND_URL: http://backend:5000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:

